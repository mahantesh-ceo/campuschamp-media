<html lang="en">
<head>

<style>
:root{--ink:#1d1d1f;--gray:#6e6e73;--hair:#e5e5ea;--tile:#f5f5f7;--blue:#0071e3;--green:#1f9d55;--red:#d70015;--bg:#fbfbfd}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,'Noto Sans Kannada','Noto Sans Devanagari',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
.wrap{max-width:640px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(140deg,#6366f1,#7c3aed 55%,#2dd4bf);display:grid;place-items:center;font:700 11px 'JetBrains Mono',monospace;font-style:normal;color:#fff}
.lang{display:flex;background:var(--tile);border-radius:999px;padding:3px}
.lang button{border:0;background:none;font:600 13px inherit;font-family:inherit;padding:7px 11px;border-radius:999px;color:var(--gray)}
.lang button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
h1{font-size:34px;line-height:1.08;letter-spacing:-.035em;font-weight:800}
.g{background:linear-gradient(90deg,#0071e3,#7c3aed 50%,#e5397a);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--gray);font-size:17px;line-height:1.45;margin-top:10px}
.card{background:#fff;border-radius:20px;padding:20px;margin-top:18px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.06)}
label{display:block;font-weight:600;font-size:14px;color:var(--gray);margin:14px 0 6px}
input[type=text],input[type=tel],select{width:100%;font:500 17px inherit;font-family:inherit;padding:14px;border:1.5px solid var(--hair);border-radius:12px;background:#fff;color:var(--ink);-webkit-appearance:none}
.ph{display:flex;align-items:stretch}.ph span{display:grid;place-items:center;padding:0 12px;border:1.5px solid var(--hair);border-right:0;border-radius:12px 0 0 12px;background:var(--tile);font-weight:700}.ph input{border-radius:0 12px 12px 0}
.roles{display:flex;gap:8px}.roles button{flex:1;border:1.5px solid var(--hair);background:#fff;border-radius:12px;padding:13px;font:600 16px inherit;font-family:inherit;color:var(--ink)}.roles button.on{border-color:var(--blue);background:#eef5ff;color:var(--blue)}
.consent{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:14px;line-height:1.45;color:#3a3a3c}.consent input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--blue)}
.ferr{color:var(--red);font-size:14px;font-weight:600;margin-top:10px;min-height:1px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font:700 17px inherit;font-family:inherit;background:var(--ink);color:#fff;margin-top:18px;text-align:center;text-decoration:none}
.btn.blue{background:var(--blue)}.btn.ghost{background:var(--tile);color:var(--ink);font-weight:600}
.btn:disabled{opacity:.45}
.steps{display:flex;gap:6px;margin:4px 0 14px}.steps b{flex:1;height:5px;border-radius:3px;background:var(--hair)}.steps b.on{background:var(--blue)}.steps b.done{background:var(--green)}
.eyebrow{font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.task{font-size:17px;line-height:1.5;margin-top:8px}
.expect{font-variant-ligatures:none;margin-top:12px;font:500 15px 'JetBrains Mono',monospace;background:var(--tile);border-radius:10px;padding:10px 12px;white-space:pre-wrap}
.expect small{display:block;font:600 12px Inter,sans-serif;color:var(--gray);margin-bottom:4px}
textarea{font-variant-ligatures:none;width:100%;min-height:170px;margin-top:14px;font:500 16px/1.55 'JetBrains Mono',monospace;padding:14px;border-radius:14px;border:1.5px solid #2b3466;background:#0b1023;color:#e2e8f0;resize:vertical;tab-size:4}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.keys button{font-variant-ligatures:none;border:0;background:var(--tile);border-radius:9px;padding:9px 0;min-width:40px;flex:1;font:600 16px 'JetBrains Mono',monospace;color:var(--ink)}
.out{font-variant-ligatures:none;margin-top:12px;min-height:54px;border-radius:14px;background:#020617;color:#e2e8f0;font:500 15px/1.55 'JetBrains Mono',monospace;padding:12px 14px;white-space:pre-wrap}
.out .err{color:#fda4af}
.row{display:flex;gap:10px}.row .btn{margin-top:12px}
.ok{display:none;margin-top:14px;border-radius:16px;padding:16px;background:#e9f8ef;color:#0f5132;font-weight:600;font-size:16px;line-height:1.45}
.ok.warn{background:#fff7e6;color:#7a4b00}
.ok b{display:block;font-size:20px;margin-bottom:4px}
.qq{margin-top:14px;font:700 19px/1.4 inherit;font-family:inherit}.qn{color:var(--gray);font-size:13px;font-weight:700;margin-top:14px}
.qo{display:block;width:100%;text-align:left;border:2px solid var(--hair);background:#fff;border-radius:14px;padding:14px 16px;margin-top:10px;font:600 16px/1.35 inherit;font-family:inherit;color:var(--ink)}
.qo.right{border-color:var(--green);background:#e9f8ef}.qo.wrong{border-color:var(--red);background:#fdecee}.qo:disabled{opacity:1}
.qf{margin-top:12px;border-radius:14px;padding:14px 16px;background:#eef4ff;color:#1e3a8a;font-size:15px;line-height:1.5}
.ok code{font-family:'JetBrains Mono',monospace;background:#fff;padding:1px 6px;border-radius:6px}
.hint{display:none;margin-top:12px;border-radius:14px;padding:14px;background:#fff7e6;color:#7a4b00;font-size:15px;line-height:1.5}
.hint code{font-family:'JetBrains Mono',monospace;background:#fff;padding:2px 6px;border-radius:6px;white-space:pre-wrap}
.status{font-size:13px;color:var(--gray);margin-top:10px;text-align:center}
#certimg{width:100%;display:block;border-radius:18px;margin-top:16px;box-shadow:0 12px 40px rgba(124,58,237,.22)}
.share{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.share button{border:0;border-radius:14px;padding:15px 10px;font:700 16px inherit;font-family:inherit;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.share .wa{background:#25D366}.share .li{background:#0A66C2}.share .ig{background:linear-gradient(45deg,#F58529,#DD2A7B 55%,#8134AF)}.share .dl{background:var(--ink)}
.share svg{width:20px;height:20px;fill:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;max-width:90vw;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.next{margin-top:22px;border-radius:20px;padding:20px;background:linear-gradient(135deg,#eef2ff,#fdf2f8)}
.next h3{font-size:20px;letter-spacing:-.02em}.next p{color:#3a3a3c;font-size:15px;line-height:1.45;margin-top:6px}
.hide{display:none}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo"><i>&lt;/&gt;</i>Champ Lab</div>
    <div class="lang"><button data-l="en" class="on">EN</button><button data-l="kn">ಕನ್ನಡ</button><button data-l="hi">हिन्दी</button></div></div>

  <!-- start -->
  <section id="start">
    <h1 data-t="hello"></h1>
    <p class="lead" data-t="intro"></p>
    <form class="card" id="form" novalidate>
      <label for="name" data-t="yourName"></label><input id="name" type="text" autocomplete="name" maxlength="60">
      <label for="phone" data-t="yourPhone"></label><div class="ph"><span>+91</span><input id="phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10" placeholder="98765 43210"></div>
      <label for="college" data-t="yourCollege"></label><input id="college" type="text" maxlength="120" autocomplete="organization">
      <label for="place" data-t="yourPlace"></label><input id="place" type="text" maxlength="60" autocomplete="address-level2">
      <label data-t="iAm"></label><div class="roles" id="roles"><button type="button" data-r="Student" class="on" data-t="student"></button><button type="button" data-r="Faculty" data-t="faculty"></button></div>
      <input class="hp" id="hp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
      <label class="consent"><input type="checkbox" id="consent"><span data-t="consent"></span></label>
      <p class="ferr" id="ferr" role="alert"></p>
      <button class="btn blue" id="go" type="submit" data-t="start"></button>
      <p class="status" id="load"></p>
    </form>
  </section>

  <!-- challenge -->
  <section id="ch" class="hide">
    <div class="steps"><b></b><b></b><b></b></div>
    <p class="eyebrow" id="cnum"></p>
    <h1 id="ctitle" style="font-size:28px;margin-top:6px"></h1>
    <p class="task" id="ctask"></p>
    <div id="codeui">
    <div class="expect"><small data-t="expected"></small><span id="cexp"></span></div>
    <textarea id="code" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false"></textarea>
    <div class="keys" id="keys"></div>
    <div class="row"><button class="btn ghost" id="hintb" data-t="hint"></button><button class="btn blue" id="run" data-t="run"></button></div>
    <div class="out" id="out"></div>
    <div class="hint" id="hint"></div>
    </div>
    <div id="quiz" class="hide"></div>
    <div class="ok" id="ok"></div>
    <button class="btn hide" id="next"></button>
  </section>

  <!-- certificate -->
  <section id="done" class="hide">
    <h1 data-t="doneTitle"></h1>
    <p class="lead" data-t="doneLead"></p>
    <img id="certimg" alt="Your Champ Lab certificate">
    <div class="share">
      <button class="wa" id="sh-wa"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.3-.8-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>WhatsApp</button>
      <button class="li" id="sh-li"><svg viewBox="0 0 24 24"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.5h4V21H3zM9.5 9.5h3.8v1.6h.1c.5-1 1.8-2 3.7-2 4 0 4.7 2.6 4.7 6V21h-4v-5.2c0-1.2 0-2.9-1.8-2.9s-2 1.4-2 2.8V21h-4z"/></svg>LinkedIn</button>
      <button class="ig" id="sh-ig"><svg viewBox="0 0 24 24"><path d="M12 7.3a4.7 4.7 0 1 0 0 9.4 4.7 4.7 0 0 0 0-9.4zm0 7.7a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm6-7.9a1.1 1.1 0 1 1-2.2 0 1.1 1.1 0 0 1 2.2 0zM21.9 7c-.1-1.6-.4-3-1.6-4.2S17.6 1.2 16 1.1C14.4 1 9.6 1 8 1.1 6.4 1.2 5 1.5 3.8 2.7S2.2 5.4 2.1 7C2 8.6 2 13.4 2.1 15c.1 1.6.4 3 1.6 4.2s2.6 1.5 4.2 1.6c1.6.1 6.4.1 8 0 1.6-.1 3-.4 4.2-1.6s1.5-2.6 1.6-4.2c.1-1.6.1-6.4 0-8zM19.8 18a3.3 3.3 0 0 1-1.8 1.8c-1.3.5-4.3.4-5.9.4s-4.6.1-5.9-.4A3.3 3.3 0 0 1 4.4 18c-.5-1.3-.4-4.3-.4-5.9s-.1-4.6.4-5.9A3.3 3.3 0 0 1 6.2 4.4c1.3-.5 4.3-.4 5.9-.4s4.6-.1 5.9.4a3.3 3.3 0 0 1 1.8 1.8c.5 1.3.4 4.3.4 5.9s.1 4.6-.4 5.9z"/></svg>Instagram</button>
      <button class="dl" id="sh-dl"><svg viewBox="0 0 24 24"><path d="M12 3v11m0 0 4.5-4.5M12 14 7.5 9.5M4 17v3h16v-3" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="download"></span></button>
    </div>
    <div class="next">
      <h3 data-t="nextTitle"></h3>
      <p data-t="nextText"></p>
      <a class="btn blue" href="https://campuschamp.in/learn/bp101t/1-1?utm_source=challenge&utm_medium=certificate" data-t="nextBtn"></a>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>

const LINK = 'https://campuschamp.in/challenge';
const T = {

const clean = (s) => s.replace(/[“”„]/g, '"').replace(/[‘’]/g, "'").replace(/ /g, ' ').replace(/\t/g, '    ');
function runPy(code) {
  py.globals.set('SRC', code);
  try {
    return py.runPython(`
import sys, io, traceback
_o = io.StringIO(); sys.stdout = _o
_err = ''
try:
    exec(SRC, {})
except Exception as e:
    tb = traceback.extract_tb(e.__traceback__)
    line = [f for f in tb if f.filename == '<string>']
    _err = (f"Line {line[-1].lineno}: " if line else '') + type(e).__name__ + ': ' + str(e)
sys.stdout = sys.__stdout__
(_o.getvalue(), _err)`).toJs();
  } catch (e) { return ['', String(e).split('\n').pop()]; }
}
// Replace the student's own "name = ..." lines with test values; null if a variable line is missing
function withValues(code, vals) {
  let out = code;
  for (const [k, v] of Object.entries(vals)) {
    const re = new RegExp(`^(\\s*)${k}\\s*=(?!=).*$`, 'm');
    if (!re.test(out)) return null;
    out = out.replace(re, `$1${k} = ${v}`);
  }
  return out;
}

  solved[cur] = true; feedback('good', `<b>${T[L].right}</b>`); $('next').classList.remove('hide'); paint(false);
};
$('hintb').onclick = () => { const h = C[cur].hint; const i = Math.min(hints, h.length - 1); $('hint').innerHTML = i === 0 ? h[0] : `<code>${esc(h[1])}</code>`; $('hint').style.display = 'block'; hints++; };
let secs = 0;
$('next').onclick = () => {
  if (cur < 2) { cur++; paint(true); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (!solved.every(Boolean)) return;
  secs = Math.round((Date.now() - t0) / 1000);
  lead('challenge_complete', { seconds: secs, quiz_score: qscore });
  $('ch').classList.add('hide'); $('done').classList.remove('hide'); drawCert(); window.scrollTo({ top: 0 });
};

/* ---------- the certificate: a 1080x1350 image (Instagram portrait size) ---------- */
let certBlob = null;
function wrapText(g, text, x, y, maxW, lh) {
  const words = text.split(' '); let line = '', lines = [];
  for (const w of words) { const t = line ? line + ' ' + w : w; if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  lines.push(line); lines.forEach((l, i) => g.fillText(l, x, y + i * lh)); return lines.length;
}
async function drawCert() {
  const m = Math.floor(secs / 60), s = secs % 60, tt = T[L];
  const F = L === 'kn' ? "'Noto Sans Kannada', Inter" : L === 'hi' ? "'Noto Sans Devanagari', Inter" : 'Inter';
  try { await Promise.all([document.fonts.load(`900 40px Inter`), document.fonts.load(`800 40px ${F}`), document.fonts.load(`600 40px ${F}`), document.fonts.load(`700 40px 'JetBrains Mono'`)]); } catch (e) {}
  const W = 1080, H = 1350, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
  // background
  const bg = g.createLinearGradient(0, 0, W, H); bg.addColorStop(0, '#0b1023'); bg.addColorStop(.55, '#1e1b4b'); bg.addColorStop(1, '#3b0764'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const glow = g.createRadialGradient(900, 120, 0, 900, 120, 600); glow.addColorStop(0, 'rgba(99,102,241,.55)'); glow.addColorStop(1, 'rgba(99,102,241,0)'); g.fillStyle = glow; g.fillRect(0, 0, W, H);
  // card
  const pad = 56; g.fillStyle = '#ffffff'; roundRect(g, pad, pad, W - 2 * pad, H - 2 * pad, 44); g.fill();
  const bar = g.createLinearGradient(pad, 0, W - pad, 0); bar.addColorStop(0, '#0071e3'); bar.addColorStop(.5, '#7c3aed'); bar.addColorStop(1, '#e5397a');
  g.fillStyle = bar; roundRect(g, pad, pad, W - 2 * pad, 22, { tl: 44, tr: 44, br: 0, bl: 0 }); g.fill();
  // brand row
  g.fillStyle = bar; roundRect(g, 120, 130, 74, 74, 20); g.fill();
  g.fillStyle = '#fff'; g.font = "700 28px 'JetBrains Mono'"; g.textAlign = 'center'; g.fillText('</>', 157, 177);
  g.textAlign = 'left'; g.fillStyle = '#1d1d1f'; g.font = '800 40px Inter'; g.fillText('Campus Champ', 214, 168);
  g.fillStyle = '#6e6e73'; g.font = '600 24px Inter'; g.fillText('Champ Lab Challenge · Python for Pharmacy', 214, 202);
  // seal
  g.save(); g.translate(880, 196); g.fillStyle = '#fbbf24';
  for (let i = 0; i < 24; i++) { g.rotate(Math.PI / 12); g.beginPath(); g.moveTo(0, -78); g.lineTo(14, -60); g.lineTo(-14, -60); g.closePath(); g.fill(); }
  g.beginPath(); g.arc(0, 0, 64, 0, Math.PI * 2); g.fill(); g.fillStyle = '#b45309'; g.font = '900 30px Inter'; g.textAlign = 'center'; g.fillText('✓', 0, -2);
  g.font = '800 14px Inter'; g.fillText('PYTHON + AI', 0, 24); g.restore();
  // title
  g.textAlign = 'center'; g.fillStyle = '#7c3aed'; g.font = `800 ${L === 'en' ? 34 : 40}px ${F}`; g.fillText(tt.certTitle, W / 2, 330);
  g.fillStyle = '#6e6e73'; g.font = `600 28px ${F}`; g.fillText(tt.certFor, W / 2, 400);
  // name
  const name = val('name') || 'Champ'; let size = 84; g.font = `900 ${size}px ${F}`;
  while (g.measureText(name).width > W - 2 * pad - 120 && size > 40) { size -= 4; g.font = `900 ${size}px ${F}`; }
  g.fillStyle = '#1d1d1f'; g.fillText(name, W / 2, 500);
  g.strokeStyle = '#e5e5ea'; g.lineWidth = 3; g.beginPath(); g.moveTo(240, 540); g.lineTo(W - 240, 540); g.stroke();
  const sub = [role === 'Faculty' ? tt.faculty : tt.student, val('college'), val('place')].filter(Boolean).join(' · ');
  g.fillStyle = '#3a3a3c'; g.font = `600 28px ${F}`; const sl = wrapText(g, sub, W / 2, 590, W - 2 * pad - 120, 38);
  // what + time
  let y = 590 + sl * 38 + 50; g.fillStyle = '#1d1d1f'; g.font = `700 36px ${F}`; const wl = wrapText(g, tt.certWhat, W / 2, y, W - 2 * pad - 140, 48);
  y += wl * 48 + 30; const tStr = tt.certTime(m, s); g.font = `900 46px ${F}`; const tw = g.measureText(tStr).width + 70;
  g.fillStyle = '#fef3c7'; roundRect(g, W / 2 - tw / 2, y - 50, tw, 78, 39); g.fill(); g.fillStyle = '#b45309'; g.fillText(tStr, W / 2, y + 4);
  // signature
  const sy = Math.min(y + 150, H - pad - 300); g.strokeStyle = '#d1d1d6'; g.lineWidth = 2; g.beginPath(); g.moveTo(W / 2 - 180, sy); g.lineTo(W / 2 + 180, sy); g.stroke();
  g.fillStyle = '#1d1d1f'; g.font = 'italic 700 34px Inter'; g.fillText('Mahantesh Goudar', W / 2, sy - 14);
  g.fillStyle = '#6e6e73'; g.font = '600 22px Inter'; g.fillText('Founder, Campus Champ', W / 2, sy + 34);
  // footer: challenge link + QR
  const fy = H - pad - 250; g.fillStyle = '#f5f5f7'; roundRect(g, pad + 40, fy, W - 2 * pad - 80, 200, 28); g.fill();
  g.textAlign = 'left'; g.fillStyle = '#3a3a3c'; g.font = `700 27px ${F}`; wrapText(g, tt.certChallenge, pad + 80, fy + 70, 560, 36);
  g.fillStyle = '#0071e3'; g.font = '900 36px Inter'; g.fillText('campuschamp.in/challenge', pad + 80, fy + 160);
  try { const qr = qrcode(0, 'M'); qr.addData(LINK); qr.make(); const n = qr.getModuleCount(), sz = 150, cell = sz / n, qx = W - pad - 80 - sz, qy = fy + 25;
    g.fillStyle = '#fff'; g.fillRect(qx - 8, qy - 8, sz + 16, sz + 16); g.fillStyle = '#0b0b0f';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) g.fillRect(qx + c * cell, qy + r * cell, Math.ceil(cell), Math.ceil(cell)); } catch (e) {}
  g.textAlign = 'center'; g.fillStyle = '#a1a1a6'; g.font = '600 22px Inter';
  g.fillText(new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' }) + ' · campuschamp.in', W / 2, H - pad - 22);
  $('certimg').src = cv.toDataURL('image/png');
  certBlob = await new Promise((r) => cv.toBlob(r, 'image/png'));
}
function roundRect(g, x, y, w, h, r) {
  const R = typeof r === 'number' ? { tl: r, tr: r, br: r, bl: r } : r;
  g.beginPath(); g.moveTo(x + R.tl, y); g.lineTo(x + w - R.tr, y); g.quadraticCurveTo(x + w, y, x + w, y + R.tr); g.lineTo(x + w, y + h - R.br); g.quadraticCurveTo(x + w, y + h, x + w - R.br, y + h);
  g.lineTo(x + R.bl, y + h); g.quadraticCurveTo(x, y + h, x, y + h - R.bl); g.lineTo(x, y + R.tl); g.quadraticCurveTo(x, y, x + R.tl, y); g.closePath();
}

/* ---------- sharing ---------- */
const shareLink = (src) => `${LINK}?utm_source=${src}&utm_medium=certificate_share`;
const shareMsg = (src) => `${T[L].shareText(Math.floor(secs / 60), secs % 60)} ${shareLink(src)}`;
const certFile = () => certBlob && new File([certBlob], 'Campus-Champ-certificate.png', { type: 'image/png' });
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 3800); }
function download() { const a = document.createElement('a'); a.href = $('certimg').src; a.download = 'Campus-Champ-certificate.png'; document.body.appendChild(a); a.click(); a.remove(); }
async function nativeShare(src) {
  const f = certFile();
  if (f && navigator.canShare && navigator.canShare({ files: [f] })) {
    try { await navigator.share({ files: [f], text: shareMsg(src), title: 'Campus Champ' }); lead('certificate_share', { channel: src, seconds: secs }); return true; } catch (e) { return e.name === 'AbortError'; }
  }
  return false;
}
$('sh-wa').onclick = async () => { if (await nativeShare('whatsapp')) return; lead('certificate_share', { channel: 'whatsapp', seconds: secs }); location.href = 'https://wa.me/?text=' + encodeURIComponent(shareMsg('whatsapp')); };
$('sh-li').onclick = async () => {
  lead('certificate_share', { channel: 'linkedin', seconds: secs });
  try { await navigator.clipboard.writeText(shareMsg('linkedin')); } catch (e) {}
  download(); toast(T[L].copied);
  setTimeout(() => window.open('https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(shareLink('linkedin')), '_blank'), 900);
};
$('sh-ig').onclick = async () => { if (await nativeShare('instagram')) return; lead('certificate_share', { channel: 'instagram', seconds: secs }); download(); toast(T[L].igTip); };
$('sh-dl').onclick = download;
tr();
</script>
