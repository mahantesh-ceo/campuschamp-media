<!doctype html>
<html lang="kn">
<head>
<meta charset="utf-8" />
<title>Campus Champ episode</title>
<link rel="stylesheet" href="fonts/g.css" />
<style>
  :root {
    --head: 'Plus Jakarta Sans', 'Noto Sans Kannada', 'Noto Sans Devanagari', 'Noto Color Emoji', sans-serif;
    --body: 'Inter', 'Noto Sans Kannada', 'Noto Sans Devanagari', 'Noto Color Emoji', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: var(--body); }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  #stage > .scene { position: absolute; inset: 0; overflow: hidden; }
  .layer { position: absolute; inset: 0; transform-origin: 50% 50%; }
  svg.art { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  .abs { position: absolute; }

  /* overlays for teaching scenes */
  #sub { position: absolute; left: 0; right: 0; bottom: 0; height: 240px; background: linear-gradient(to top, rgba(5,8,22,.86), rgba(5,8,22,0)); pointer-events: none; }
  #sub p { position: absolute; left: 50%; bottom: 66px; transform: translateX(-50%); width: 1560px; text-align: center; color: #fff; font-size: 46px; font-weight: 500; line-height: 1.35; text-shadow: 0 2px 18px rgba(0,0,0,.6); }
  #voice { position: absolute; left: 64px; bottom: 58px; display: flex; align-items: center; gap: 12px; color: rgba(255,255,255,.85); font-family: var(--head); font-weight: 700; font-size: 22px; }
  #voice i { display: inline-flex; gap: 4px; align-items: center; height: 32px; }
  #voice i b { width: 5px; border-radius: 3px; background: #2dd4bf; }
  #mark { position: absolute; right: 64px; top: 54px; display: flex; align-items: center; gap: 12px; color: rgba(255,255,255,.78); font-family: var(--head); font-weight: 700; font-size: 22px; }
  #mark span { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.12); border: 1.5px solid rgba(255,255,255,.25); display: grid; place-items: center; font-family: var(--mono); font-size: 16px; color: #fff; }
  #chapter { position: absolute; left: 64px; top: 60px; color: rgba(255,255,255,.75); font-family: var(--head); font-weight: 700; font-size: 24px; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }

  /* shared pieces */
  .h { font-family: var(--head); font-weight: 800; letter-spacing: -.01em; }
  .tag { font-family: var(--head); font-weight: 700; font-size: 32px; color: #e0e7ff; background: rgba(124,92,255,.2); border: 1.5px solid rgba(165,180,252,.5); border-radius: 999px; padding: 14px 26px; white-space: nowrap; }
  .card { background: #fffaf0; border-radius: 28px; box-shadow: 0 30px 60px rgba(2,6,23,.45); color: #0f172a; }
  .lbl { display: flex; align-items: center; gap: 22px; }
  .lbl .n { width: 64px; height: 64px; border-radius: 50%; background: #2dd4bf; color: #04201d; display: grid; place-items: center; font-family: var(--head); font-weight: 800; font-size: 30px; box-shadow: 0 0 0 10px rgba(45,212,191,.18); flex: none; }
  .lbl .t { font-family: var(--head); font-weight: 800; font-size: 52px; color: #fff; line-height: 1.05; }
  .lbl .k { display: block; font-family: var(--body); font-weight: 500; font-size: 30px; color: #99f6e4; margin-top: 6px; }
  .step { display: flex; align-items: center; gap: 22px; padding: 22px 28px; border-radius: 22px; background: rgba(255,255,255,.07); border: 1.5px solid rgba(255,255,255,.14); color: #e0e7ff; font-size: 36px; font-weight: 600; }
  .step .n { width: 54px; height: 54px; border-radius: 16px; background: rgba(255,255,255,.12); display: grid; place-items: center; font-family: var(--head); font-weight: 800; font-size: 28px; flex: none; }
  .step.on { background: rgba(45,212,191,.18); border-color: #2dd4bf; color: #fff; box-shadow: 0 0 40px rgba(45,212,191,.25); }
  .step.on .n { background: #2dd4bf; color: #04201d; }
  .cmp { display: flex; align-items: center; gap: 18px; background: rgba(255,255,255,.08); border: 1.5px solid rgba(255,255,255,.18); border-radius: 28px; padding: 22px 30px; color: #fff; font-family: var(--head); font-weight: 700; font-size: 38px; }
  .cmp .ic { width: 66px; height: 66px; border-radius: 18px; display: grid; place-items: center; font-size: 34px; font-weight: 800; }
  .brand { background: #fbfbfd; color: #1d1d1f; }
  .grad { background: linear-gradient(90deg, #4f46e5, #7c3aed 50%, #0d9488); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .opt { display: flex; align-items: center; gap: 24px; border-radius: 28px; padding: 28px 34px; font-size: 40px; font-weight: 600; background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.16); color: #fff; }
  .opt .l { width: 64px; height: 64px; border-radius: 18px; background: rgba(255,255,255,.12); display: grid; place-items: center; font-family: var(--head); font-weight: 800; flex: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="overlay">
  <div id="sub"><p></p></div>
  <div id="voice"><i><b></b><b></b><b></b><b></b><b></b></i>Anu</div>
  <div id="mark"><span>&lt;/&gt;</span>Campus Champ</div>
  <div id="chapter"></div>
</div>
<div id="fade"></div>
<script src="scenes.js"></script>
<script src="scenes-ep2.js"></script>
</body>
</html>
