<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../render/fonts/g.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:'Plus Jakarta Sans','Noto Sans Kannada','Noto Sans Devanagari',sans-serif}
.H{font-weight:800;letter-spacing:-.035em}
.gl{background:linear-gradient(90deg,#a5b4fc,#c084fc 50%,#5eead4);-webkit-background-clip:text;background-clip:text;color:transparent}
#icon{width:800px;height:800px;position:relative;overflow:hidden;background:linear-gradient(140deg,#4f46e5,#7c3aed 55%,#14b8a6);display:none}
#icon .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
#icon .m{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:250px;line-height:1;text-shadow:0 10px 60px rgba(0,0,0,.25)}
#icon .l{margin-top:40px;padding:14px 44px;border-radius:999px;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.45);font-weight:800;font-size:76px;line-height:1.1}
#banner{width:2560px;height:1440px;position:relative;overflow:hidden;background:#000;display:none}
.glow{position:absolute;border-radius:50%;filter:blur(40px)}
.safe{position:absolute;left:507px;top:508px;width:1546px;height:423px;display:flex;align-items:center;gap:60px}
.logo{width:250px;height:250px;flex:none;border-radius:70px;background:linear-gradient(140deg,#6366f1,#7c3aed 55%,#2dd4bf);display:grid;place-items:center;color:#fff;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:96px;box-shadow:0 0 120px rgba(124,92,255,.55)}
.sems{position:absolute;left:0;right:0;top:1000px;display:flex;justify-content:center;gap:14px;font-family:'JetBrains Mono',monospace;font-size:26px;color:#71717a}
</style></head><body>
<div id="icon"><div class="c"><div class="m">&lt;/&gt;</div><div class="l" id="il"></div></div></div>
<div id="banner">
  <div class="glow" style="left:600px;top:300px;width:1300px;height:900px;background:rgba(99,102,241,.32)"></div>
  <div class="glow" style="left:1500px;top:250px;width:900px;height:700px;background:rgba(45,212,191,.16)"></div>
  <div class="safe">
    <div class="logo">&lt;/&gt;</div>
    <div>
      <p class="H" style="font-size:108px;line-height:1;color:#fff;white-space:nowrap" id="bn"></p>
      <p class="H" style="margin-top:22px;font-size:76px;line-height:1.1" id="bt"></p>
      <p style="margin-top:22px;font-weight:700;font-size:40px;color:#a1a1aa" id="bs"></p>
    </div>
  </div>
  <div class="sems" id="sm"></div>
</div>
<script>
window.paint=(o)=>{
  document.getElementById(o.kind).style.display='block';
  if(o.kind==='icon'){document.getElementById('il').textContent=o.label;}
  else{
    document.getElementById('bn').textContent=o.name;
    document.getElementById('bt').innerHTML='<span class="gl">'+o.tag+'</span>';
    document.getElementById('bs').textContent=o.sub;
    document.getElementById('sm').innerHTML=['BP101T','BP201T','BP212P','BP301T','BP604T','BP610P','BP703T','BP801T'].map((c,i)=>'<span style="padding:10px 20px;border-radius:999px;border:2px solid '+(i?'#3f3f46':'#22c55e')+';color:'+(i?'#71717a':'#86efac')+'">'+c+'</span>').join('');
  }
};
</script></body></html>
