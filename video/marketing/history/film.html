<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600&family=Noto+Sans+Kannada:wght@600;700&family=Noto+Sans+Devanagari:wght@600;700&family=Newsreader:opsz,wght@6..72,500;6..72,700&display=swap">
<style>
:root{--ink:#1d1d1f;--gray:#6e6e73;--hair:#d2d2d7;--tile:#f5f5f7}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;background:#fbfbfd;font-family:Inter,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
body.V{width:1080px;height:1920px}body.H{width:1920px;height:1080px}
.sc{position:absolute;inset:0;overflow:hidden;opacity:0}
.bg{position:absolute;inset:0}
.lay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6vmin}
.V .lay{flex-direction:column;justify-content:flex-start;padding:24vmin 8vmin 0}
.H .lay{flex-direction:row;padding:0 9vmin}
.txt{flex:none}.V .txt{width:100%}.H .txt{width:50%}
.vis{position:relative;flex:none;display:flex;align-items:center;justify-content:center}
.V .vis{width:100%;height:96vmin}.H .vis{width:42%;height:80vmin}
.center .txt{text-align:center}.H .center .txt{width:84%}.H .center{flex-direction:column;justify-content:center;gap:5vmin}
.V .center{justify-content:center;padding-top:0}
h1{font-weight:800;letter-spacing:-.045em;line-height:1.02}
.h1{font-size:9vmin}.h1b{font-size:12vmin}.h1s{font-size:7vmin}
.sub{font-weight:600;color:var(--gray);letter-spacing:-.02em;font-size:4.4vmin;line-height:1.22;margin-top:2.6vmin}
.eyebrow{font-weight:700;font-size:2.5vmin;letter-spacing:.14em;text-transform:uppercase;color:var(--gray);margin-bottom:2.4vmin}
.g{background:linear-gradient(90deg,#0071e3,#7c3aed 55%,#e3306c);-webkit-background-clip:text;background-clip:text;color:transparent}
.w{display:inline-block;opacity:0}
.tile{background:#fff;border-radius:3.2vmin;box-shadow:0 1px 2px rgba(0,0,0,.04),0 2vmin 6vmin rgba(0,0,0,.08)}
.glass{background:rgba(255,255,255,.75);backdrop-filter:blur(2vmin);border:1px solid rgba(255,255,255,.95);box-shadow:0 2vmin 7vmin -2vmin rgba(30,30,90,.18);border-radius:3vmin}
.phone{position:absolute;width:30vmin;border-radius:5.5vmin;background:#1d1d1f;padding:1vmin;box-shadow:0 4vmin 10vmin rgba(0,0,0,.2)}
.phone img{width:100%;display:block;border-radius:4.6vmin}
.mono{font-family:'JetBrains Mono',monospace;font-variant-ligatures:none}
.chip{display:inline-block;font-weight:700;border-radius:999px;padding:1.4vmin 3vmin;font-size:2.9vmin;background:#fff;box-shadow:0 1vmin 3vmin rgba(0,0,0,.08)}
.pill{display:inline-block;font-weight:700;font-size:2.7vmin;border-radius:999px;padding:1.4vmin 3.2vmin;color:#fff;background:#1d1d1f}
.stack{display:grid}.stack>*{grid-area:1/1}
.blob{position:absolute;border-radius:50%;filter:blur(10vmin);opacity:0}
.big{font-weight:800;letter-spacing:-.055em;line-height:.9}
.kn{font-family:'Noto Sans Kannada'}.hi{font-family:'Noto Sans Devanagari'}
#cap{position:absolute;left:8vmin;right:8vmin;z-index:70;text-align:center;font-weight:600;font-size:3.3vmin;line-height:1.35;color:#1d1d1f}
.V #cap{bottom:12vmin}.H #cap{bottom:5vmin;font-size:2.8vmin}
#cap span{background:rgba(255,255,255,.85);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:.4vmin 1.6vmin;border-radius:1.2vmin}
#mark{position:absolute;z-index:70;display:flex;align-items:center;gap:1.4vmin;font-weight:700;font-size:2.4vmin;color:#1d1d1f}
.V #mark{left:0;right:0;justify-content:center;top:7vmin}.H #mark{left:5vmin;top:5vmin}
#mark i{width:4vmin;height:4vmin;border-radius:1.2vmin;background:linear-gradient(140deg,#6366f1,#7c3aed 55%,#2dd4bf);display:grid;place-items:center;font:700 1.5vmin ui-monospace,monospace;font-style:normal;color:#fff}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:60;pointer-events:none}
.dot{width:1.6vmin;height:1.6vmin;border-radius:50%;background:#d2d2d7}
</style></head><body class="__MODE__">
<div id="stage"></div><div id="flash"></div>
<div id="mark"><i>&lt;/&gt;</i>Campus Champ</div>
<div id="cap"></div>
<script>
const TL = __TIMELINE__; const QR = '__QR__'; const MODE = '__MODE__';
const $ = (q, el = document) => el.querySelector(q), $$ = (q, el = document) => [...el.querySelectorAll(q)];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)); const ease = (x) => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
const ap = (t, a, d = 0.6) => ease((t - a) / d); const lerp = (a, b, k) => a + (b - a) * k;
const SC = {}; TL.scenes.forEach((s) => (SC[s.id] = s));
const LN = (sc) => TL.lines.filter((l) => l.scene === sc); const S = (sc, k) => (LN(sc)[k] || {}).start ?? 1e9; const Dd = (sc, k) => (LN(sc)[k] || {}).dur ?? 1;
const words = (txt, cls = '') => txt.split(' ').map((w) => `<span class="w ${cls}">${w}</span>`).join(' ');
const reveal = (el, t, a, per = 0.08) => el && $$('.w', el).forEach((w, i) => { const p = ap(t, a + i * per, 0.55); w.style.opacity = p; w.style.transform = `translateY(${(1 - p) * 0.4}em)`; w.style.filter = `blur(${(1 - p) * 10}px)`; });
const show = (el, p, dy = 4, sc = 1) => { if (!el) return; el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * dy}vmin) scale(${lerp(sc, 1, p)})`; };
const fmt = (v, d = 0) => v.toLocaleString('en-IN', { minimumFractionDigits: d, maximumFractionDigits: d });
const blobs = (cols) => cols.map(([c, x, y, s]) => `<div class="blob" style="background:${c};left:${x}%;top:${y}%;width:${s}vmin;height:${s}vmin"></div>`).join('');
const blobOn = (el, k) => $$('.blob', el).forEach((b, i) => { b.style.opacity = k * 0.7; b.style.transform = `scale(${0.7 + k * 0.4}) translate(${Math.sin(i + k * 2) * 3}vmin,0)`; });
const hex = (sz, col = '#1d1d1f', sw = 5) => `<svg viewBox="0 0 120 120" style="width:${sz}vmin;height:${sz}vmin" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linejoin="round"><polygon points="60,18 96,39 96,81 60,102 24,81 24,39"/><line x1="96" y1="39" x2="114" y2="28"/><line x1="24" y1="81" x2="6" y2="92"/></svg>`;
let seed = 3; const rnd = () => ((seed = (seed * 9301 + 49297) % 233280), seed / 233280);
const MOLS = Array.from({ length: 46 }, () => ({ x: rnd() * 100, y: rnd() * 100, s: 3 + rnd() * 5, r: rnd() * 360, o: 0.12 + rnd() * 0.3, c: ['#0071e3', '#7c3aed', '#e3306c', '#1d1d1f'][Math.floor(rnd() * 4)] }));
const molField = () => MOLS.map((m, i) => `<div class="mol" data-i="${i}" style="position:absolute;left:${m.x}%;top:${m.y}%;opacity:0">${hex(m.s, '#1d1d1f', 4)}<span style="position:absolute;right:-.6vmin;top:-.2vmin;width:1.2vmin;height:1.2vmin;border-radius:50%;background:${m.c}"></span></div>`).join('');

const SEMS = [
  ['Semester I', 'Python Programming', 'Her first line of code.', 'code'],
  ['Semester II', 'Biostatistics & Data Analytics', 'Bioequivalence, proven.', 'ci'],
  ['Semester III', 'Machine Learning', 'Predict before you make.', 'ml'],
  ['Semester V', 'Innovation & Startups', 'Idea. Prototype. Pilot.', 'startup'],
  ['Semester VI', 'AI in Pharmaceutical Sciences · Computer-Aided Drug Design', 'Dock. Score. Rank.', 'cadd'],
  ['Semester VII', 'AI in Clinical Practice', 'Signals in thousands of reports.', 'pv'],
  ['Semester VIII', 'Ethics of AI in Pharmacy', 'Fair. Explainable. Safe.', 'ethics'],
];
const semVis = (k) => {
  if (k === 'code') return `<div style="width:100%;background:#0b0b0f;border-radius:3vmin;padding:4vmin 4.4vmin;color:#f5f5f7;font-size:3.4vmin;line-height:1.8" class="mono"><div style="display:flex;gap:1vmin;margin-bottom:3vmin"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span></div><div><span style="color:#7dd3fc">print</span>(<span style="color:#ffa372" class="ty" data-full='"Paracetamol 500 mg"'></span>)</div><div class="out" style="margin-top:3vmin;padding-top:2.4vmin;border-top:1px solid #333;color:#7ee787;opacity:0">Paracetamol 500 mg</div></div>`;
  if (k === 'ci') return `<div class="tile" style="width:100%;padding:5vmin 4.4vmin"><p style="font-weight:700;font-size:2.3vmin;letter-spacing:.12em;color:var(--gray)">BIOEQUIVALENCE · 90% CI</p><div style="position:relative;height:16vmin;margin-top:4vmin"><div style="position:absolute;left:20%;right:20%;top:2vmin;bottom:2vmin;background:#e8f1ff;border-radius:1.6vmin;border:.3vmin dashed #0071e3"></div><span style="position:absolute;left:20%;bottom:-3.4vmin;transform:translateX(-50%);font-weight:700;font-size:2.4vmin;color:#0071e3">80%</span><span style="position:absolute;right:20%;bottom:-3.4vmin;transform:translateX(50%);font-weight:700;font-size:2.4vmin;color:#0071e3">125%</span><div class="cib" style="position:absolute;top:6.4vmin;height:3.2vmin;border-radius:2vmin;background:linear-gradient(90deg,#7c3aed,#e3306c)"></div><div class="cim" style="position:absolute;top:5vmin;width:1vmin;height:6vmin;background:#1d1d1f;border-radius:1vmin"></div></div><p class="ok" style="margin-top:6vmin;font-weight:800;font-size:4vmin;color:#1d7a46;opacity:0">✓ Bioequivalent</p></div>`;
  if (k === 'ethics') return `<div class="tile" style="width:100%;padding:5vmin 4.4vmin"><p style="font-weight:700;font-size:2.3vmin;letter-spacing:.12em;color:var(--gray)">MODEL CREDIBILITY</p>${['Fair across patient groups', 'Explainable decisions', 'Validated and safe'].map((x) => `<div class="tk" style="display:flex;gap:2.4vmin;align-items:center;margin-top:3.4vmin;opacity:0"><span style="flex:none;width:5vmin;height:5vmin;border-radius:50%;background:linear-gradient(135deg,#0071e3,#7c3aed);color:#fff;display:grid;place-items:center;font-weight:800;font-size:2.8vmin">✓</span><span style="font-weight:700;font-size:3.6vmin;letter-spacing:-.02em">${x}</span></div>`).join('')}</div>`;
  return `<img src="shots/${k}.png" style="width:100%;display:block;border-radius:3vmin;box-shadow:0 3vmin 8vmin -3vmin rgba(0,0,0,.25)">`;
};

const B = {
hist: () => `<div class="bg" style="background:#fff"></div>${blobs([['#ffc2dc', 70, -10, 70], ['#c9d4ff', -10, 55, 70]])}
  <div class="lay center" style="gap:3vmin"><div class="txt"><p class="sub" id="h0" style="margin:0;font-size:4.6vmin">${words('Every few decades, a profession is rewritten.')}</p></div>
  <div style="position:relative;width:${MODE === 'V' ? 90 : 150}vmin;height:${MODE === 'V' ? 70 : 34}vmin">
   <svg viewBox="0 0 1000 300" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible"><defs><linearGradient id="tr" x1="0" x2="1"><stop offset="0" stop-color="#d2d2d7"/><stop offset=".7" stop-color="#7c3aed"/><stop offset="1" stop-color="#e3306c"/></linearGradient></defs>
    <path id="trail" d="M0 250 C 250 250, 380 200, 500 190 S 800 120, 1000 60" stroke="url(#tr)" stroke-width="6" fill="none" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>
   ${[['1928', 'Penicillin', 12, 76], ['1953', 'The double helix', 36, 64], ['2003', 'The genome', 60, 52], ['2024', 'Nobel Prize for AI', 84, 30]].map(([y, n, x, top], i) => `<div class="yr" style="position:absolute;left:${x}%;top:${top}%;transform:translateX(-50%);text-align:center;opacity:0"><div style="width:2.4vmin;height:2.4vmin;border-radius:50%;margin:0 auto 1.6vmin;background:${i === 3 ? '#7c3aed' : '#1d1d1f'}"></div><p style="font-weight:800;font-size:5vmin;letter-spacing:-.04em;color:${i === 3 ? '#7c3aed' : '#1d1d1f'}">${y}</p><p style="font-weight:600;font-size:2.4vmin;color:var(--gray)">${n}</p></div>`).join('')}
  </div>
  <div class="txt" id="y26" style="opacity:0"><p class="big g" style="font-size:22vmin">2026</p><p style="font-weight:700;font-size:4.2vmin;letter-spacing:-.02em;margin-top:1vmin">AI enters every pharmacy classroom.</p></div></div>`,
search: () => `<div class="bg" style="background:radial-gradient(ellipse at 50% 50%,#fff,#eef0fa)"></div><div id="mf">${molField()}</div>
  <div class="lay center"><div class="txt stack">
   <div id="s1"><p class="big" style="font-size:34vmin">10<span class="g" style="font-size:17vmin;vertical-align:top;line-height:1" id="exp">0</span></p><p style="font-weight:700;font-size:4.6vmin;letter-spacing:-.02em;margin-top:2vmin">possible drug-like molecules</p><p class="sub" style="margin-top:1vmin;font-size:3.4vmin">More than the atoms in our solar system.</p></div>
   <div id="s2" style="opacity:0;display:flex;flex-direction:column;align-items:center">
    <svg viewBox="0 0 600 420" style="width:${MODE === 'V' ? 80 : 70}vmin"><defs><radialGradient id="one"><stop offset="0" stop-color="#e3306c"/><stop offset="1" stop-color="#7c3aed"/></radialGradient></defs>
     <path id="fun" d="M20 10 H580 L360 300 H240 Z" fill="#ececf3"/>
     <text x="300" y="110" text-anchor="middle" font-family="Inter" font-weight="800" font-size="64" letter-spacing="-3" fill="#1d1d1f" id="ftx">10,000</text>
     <text x="300" y="150" text-anchor="middle" font-family="Inter" font-weight="600" font-size="20" fill="#6e6e73">compounds tested in labs</text>
     <circle id="o1" cx="300" cy="360" r="48" fill="url(#one)" opacity="0"/><text id="o1t" x="300" y="380" text-anchor="middle" font-family="Inter" font-weight="800" font-size="56" fill="#fff" opacity="0">1</text></svg>
    <div style="display:flex;gap:2vmin;margin-top:3vmin">${['15 years', 'Billions of dollars', 'One medicine'].map((x, i) => `<span class="chip fx" style="opacity:0;${i === 2 ? 'background:#1d1d1f;color:#fff' : ''}">${x}</span>`).join('')}</div></div>
  </div></div>`,
smiles: () => `<div class="bg" style="background:#fbfbfd"></div>${blobs([['#c9d4ff', 60, 10, 60]])}<div class="lay"><div class="txt">
  <p class="eyebrow">AI reads chemistry</p><h1 class="h1" id="sm1">${words('To a model, paracetamol is')} <span class="w g">18</span> <span class="w g">characters.</span></h1></div>
  <div class="vis"><div style="text-align:center;width:100%"><p class="mono" id="smi" style="font-size:${MODE === 'V' ? 6.4 : 5}vmin;font-weight:600;letter-spacing:.02em;min-height:8vmin"></p>
   <div id="cnt" class="mono" style="font-size:2.6vmin;color:var(--gray);margin-top:1vmin;opacity:0">18 characters</div>
   <div id="molbig" style="margin:4vmin auto 0;width:40vmin;opacity:0">
    <svg viewBox="0 0 300 200" style="width:100%"><g fill="none" stroke="#1d1d1f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><polygon points="165,57 215,57 240,100 215,143 165,143 140,100"/><circle cx="190" cy="100" r="24" stroke-width="3.5"/><line x1="240" y1="100" x2="262" y2="100"/><line x1="140" y1="100" x2="118" y2="100"/><line x1="92" y1="96" x2="72" y2="78"/><line x1="68" y1="78" x2="68" y2="44"/><line x1="78" y1="78" x2="78" y2="44"/><line x1="72" y1="78" x2="40" y2="98"/></g><text x="266" y="108" font-family="Inter" font-size="22" font-weight="800" fill="#e3306c">OH</text><text x="105" y="108" font-family="Inter" font-size="22" font-weight="800" fill="#0071e3" text-anchor="middle">N</text><text x="105" y="130" font-family="Inter" font-size="16" font-weight="700" fill="#0071e3" text-anchor="middle">H</text><text x="73" y="34" font-family="Inter" font-size="22" font-weight="800" fill="#e3306c" text-anchor="middle">O</text><text x="30" y="118" font-family="Inter" font-size="16" font-weight="700" fill="#6e6e73" text-anchor="middle">CH₃</text></svg>
    <p style="font-weight:700;font-size:3vmin;margin-top:1vmin">Paracetamol</p></div></div></div></div>`,
fold: () => `<div class="bg" style="background:#fff"></div><div class="lay"><div class="txt"><p class="eyebrow">AlphaFold</p>
  <p class="big g" style="font-size:20vmin" id="fn">0M+</p><h1 class="h1s" id="fl" style="margin-top:2vmin">${words('protein structures predicted.')}</h1>
  <div id="pl" style="display:flex;gap:2vmin;margin-top:3vmin;opacity:0;font-weight:600;font-size:2.6vmin;color:var(--gray);align-items:center">Confidence <span style="width:3vmin;height:3vmin;border-radius:.8vmin;background:#0053D6"></span>very high <span style="width:3vmin;height:3vmin;border-radius:.8vmin;background:#65CBF3"></span>high <span style="width:3vmin;height:3vmin;border-radius:.8vmin;background:#FFDB13"></span>low</div></div>
  <div class="vis"><div id="pimg" style="width:100%;border-radius:3.2vmin;overflow:hidden;background:linear-gradient(135deg,#EFF6FF,#E0E7FF);opacity:0;box-shadow:0 3vmin 8vmin -3vmin rgba(0,0,0,.2)"><img src="shots/protein.png" style="width:100%;display:block"></div>
   <div id="nob" class="pill" style="position:absolute;right:2vmin;top:2vmin;opacity:0;background:linear-gradient(90deg,#b8860b,#e0b84c)">Nobel Prize · 2024</div></div></div>`,
abx: () => `<div class="bg" style="background:#fbfbfd"></div><div class="lay"><div class="txt"><p class="eyebrow">Deep learning finds an antibiotic</p>
  <p class="big g" style="font-size:20vmin" id="an">0M+</p><h1 class="h1s" style="margin-top:2vmin" id="al">${words('molecules screened by a neural network.')}</h1>
  <div id="found" style="margin-top:3vmin;opacity:0"><span class="pill" style="background:#1d7a46">✓ A new antibiotic</span></div></div>
  <div class="vis"><svg id="nn" viewBox="0 0 400 320" style="width:100%">
   ${[[60, [60, 130, 200, 270]], [200, [40, 110, 180, 250, 300]], [340, [120, 200]]].map(([x, ys], li) => ys.map((y) => `<circle cx="${x}" cy="${y}" r="14" fill="${li === 2 ? '#e3306c' : '#0071e3'}" opacity=".9"/>`).join('')).join('')}
   <g stroke="#c7c7d6" stroke-width="1.5">${[60, 130, 200, 270].map((a) => [40, 110, 180, 250, 300].map((b) => `<line x1="60" y1="${a}" x2="200" y2="${b}"/>`).join('')).join('')}${[40, 110, 180, 250, 300].map((a) => [120, 200].map((b) => `<line x1="200" y1="${a}" x2="340" y2="${b}"/>`).join('')).join('')}</g>
   <g id="pk">${Array.from({ length: 10 }, (_, i) => `<circle class="pkt" r="5" fill="#7c3aed"/>`).join('')}</g></svg></div></div>`,
data: () => `<div class="bg" style="background:#fff"></div><div class="lay center"><div class="txt" style="display:flex;gap:6vmin;justify-content:center;${MODE === 'V' ? 'flex-direction:column' : ''}">
  <div class="tile" id="d1" style="flex:1;padding:6vmin 5vmin;opacity:0;text-align:center"><p class="big g" style="font-size:16vmin" id="dn">0M</p><p style="font-weight:700;font-size:3.6vmin;margin-top:2vmin;letter-spacing:-.02em">data points in one Phase III trial</p>
   <div style="display:flex;gap:.5vmin;justify-content:center;align-items:flex-end;height:10vmin;margin-top:3vmin">${Array.from({ length: 28 }, (_, i) => `<span class="db" style="width:1.2vmin;background:linear-gradient(#0071e3,#7c3aed);border-radius:.6vmin;height:${20 + ((i * 37) % 80)}%"></span>`).join('')}</div></div>
  <div class="tile" id="d2" style="flex:1;padding:6vmin 5vmin;opacity:0;text-align:center"><p class="big g" style="font-size:16vmin" id="fd">0+</p><p style="font-weight:700;font-size:3.6vmin;margin-top:2vmin;letter-spacing:-.02em">FDA drug submissions built with AI</p><p class="sub" style="font-size:2.8vmin">since 2016</p></div></div></div>`,
india: () => `<div class="bg" style="background:#fbfbfd"></div>${blobs([['#ffd3a8', 10, 30, 70], ['#c9f2d9', 60, 40, 60]])}<div class="lay center"><div class="txt">
  <div style="display:flex;gap:3vmin;justify-content:center;margin-bottom:5vmin">${[0, 1, 2, 3, 4].map((i) => `<div class="pp" style="width:${MODE === 'V' ? 14 : 11}vmin;height:${MODE === 'V' ? 28 : 22}vmin;border-radius:8vmin;opacity:0;background:${i === 0 ? 'linear-gradient(160deg,#ff9933,#ffffff 50%,#138808)' : '#e5e5ea'};box-shadow:0 2vmin 5vmin -2vmin rgba(0,0,0,.2)"></div>`).join('')}</div>
  <p class="big g" style="font-size:16vmin;opacity:0" id="i15">1 in 5</p>
  <h1 class="h1s" id="il" style="margin-top:2vmin">${words('of the world’s generic medicines are made in India.')}</h1>
