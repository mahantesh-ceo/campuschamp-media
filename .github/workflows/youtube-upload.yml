name: Publish episode on YouTube

# Runs by itself when new episode metadata (video/meta/*.json) is pushed, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ["video/meta/*.json", "video/trailer-*.json"]
  workflow_dispatch:
    inputs:
      meta:
        description: "Episode metadata file(s): all languages of an episode, e.g. video/meta/bp101t-1-1-ep1-*.json, or one file"
        required: true
        default: "video/meta/bp101t-1-1-ep1-*.json"
      publish:
        description: "public (default) · private · or a time like 2026-11-02T18:30:00+05:30"
        required: true
        default: "public"

permissions:
  contents: write

concurrency:
  group: youtube-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Which episodes
        id: which
        env:
          INPUT_META: ${{ inputs.meta }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            git fetch -q --depth=1 origin "$BEFORE" 2>/dev/null || true
            files=$(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- 'video/meta/*.json' 'video/trailer-*.json' 2>/dev/null || ls video/meta/*.json)
          else
            files="$INPUT_META"
          fi
          echo "meta=$(echo $files)" >> "$GITHUB_OUTPUT"
          echo "Episodes: $files"
      - name: Upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_HI: ${{ secrets.YT_REFRESH_TOKEN_HI }}
          YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
          PUBLISH: ${{ inputs.publish || 'public' }}
          META: ${{ steps.which.outputs.meta }}
        # every language of the episode; one language failing doesn't stop the others
        run: |
          fail=0
          for f in $META; do
            echo "::group::$f"
            # channel trailers (the brand film) and lesson episodes use different publishers
            case "$f" in
              video/trailer-*) python tools/youtube_trailer.py "$f" || fail=1 ;;
              *) python tools/youtube_upload.py "$f" || fail=1 ;;
            esac
            echo "::endgroup::"
          done
          exit $fail
      - name: Save the YouTube id for the website
        if: always()
        run: |
          git config user.name "Campus Champ video bot"
          git config user.email "video-bot@campuschamp.in"
          git add content/bp101t/videos.json
          if [ -f video/playlists.json ]; then git add video/playlists.json; fi
          if [ -f video/trailers.json ]; then git add video/trailers.json; fi
          git commit -m "YouTube ids for ${{ steps.which.outputs.meta }}" || echo "nothing to commit"
          git pull -q --rebase origin main && git push
